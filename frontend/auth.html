<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Meal Rescue</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="logo">
          <div class="logo-icon">🍱</div>
          Meal<span style="color:var(--color-accent)">Rescue</span>
        </a>
        <p>Save food, save money, save the planet</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" data-tab="register" onclick="switchTab('register')">Join Free</button>
      </div>

      <div class="auth-forms">
        <div class="auth-form-wrapper" id="formWrapper">
          <!-- Login Form -->
          <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
              <input type="email" id="loginEmail" placeholder=" " required autocomplete="email">
              <label>Email address</label>
              <div class="form-error">Please enter a valid email</div>
            </div>
            <div class="form-group">
              <input type="password" id="loginPassword" placeholder=" " required minlength="6" autocomplete="current-password">
              <label>Password</label>
              <div class="form-error">Password must be at least 6 characters</div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
              <span class="btn-text">Sign In</span>
              <span class="spinner"></span>
            </button>
          </form>

          <!-- Register Form -->
          <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
            <div class="role-toggle">
              <button type="button" class="role-option active" onclick="setRole('consumer')">🍽️ Consumer</button>
              <button type="button" class="role-option" onclick="setRole('merchant')">🏪 Merchant</button>
            </div>

            <div class="form-group">
              <input type="text" id="regName" placeholder=" " required minlength="2" autocomplete="name">
              <label>Full Name</label>
              <div class="form-error">Name must be at least 2 characters</div>
            </div>
            <div class="form-group">
              <input type="email" id="regEmail" placeholder=" " required autocomplete="email">
              <label>Email address</label>
              <div class="form-error">Please enter a valid email</div>
            </div>
            <div class="form-group">
              <input type="password" id="regPassword" placeholder=" " required minlength="6" autocomplete="new-password">
              <label>Password</label>
              <div class="form-error">Password must be at least 6 characters</div>
            </div>

            <div class="merchant-fields" id="merchantFields">
              <div class="form-group">
                <input type="text" id="regShopName" placeholder=" " autocomplete="organization">
                <label>Shop Name</label>
              </div>
              <div class="form-group">
                <input type="text" id="regFssai" placeholder=" ">
                <label>FSSAI Number (optional)</label>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" id="registerBtn">
              <span class="btn-text">Create Account</span>
              <span class="spinner"></span>
            </button>
          </form>
        </div>
      </div>

      <div class="auth-footer">
        <p>By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
