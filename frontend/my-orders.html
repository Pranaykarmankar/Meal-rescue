<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Meal Rescue</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    .orders-page { min-height:100vh; background:var(--color-bg); }
    .orders-content { max-width:800px; margin:0 auto; padding:1.5rem; }
    .orders-content h1 { margin-bottom:1.5rem; font-size:1.75rem; }
    .order-card { background:var(--color-surface); border-radius:var(--radius-lg); padding:1.5rem; box-shadow:var(--shadow-sm); border:1px solid var(--color-border-light); margin-bottom:1rem; display:flex; gap:1.25rem; align-items:center; transition:all var(--transition); animation:fadeSlideUp 0.4s ease; }
    .order-card:hover { box-shadow:var(--shadow-md); }
    .order-img { width:80px; height:80px; border-radius:var(--radius-md); overflow:hidden; flex-shrink:0; background:var(--color-primary-bg); display:flex; align-items:center; justify-content:center; font-size:2rem; }
    .order-img img { width:100%; height:100%; object-fit:cover; }
    .order-info { flex:1; }
    .order-info h4 { font-size:1rem; margin-bottom:0.25rem; }
    .order-info .shop { font-size:0.85rem; color:var(--color-text-muted); }
    .order-info .price { font-size:1.1rem; font-weight:700; color:var(--color-primary); margin-top:0.25rem; }
    .order-status { padding:0.3rem 0.75rem; border-radius:var(--radius-pill); font-size:0.75rem; font-weight:700; text-transform:uppercase; }
    .order-status.pending { background:var(--color-accent-light); color:#92400E; }
    .order-status.completed { background:var(--color-success-light); color:#065F46; }
    .order-status.cancelled { background:var(--color-danger-light); color:#991B1B; }
    .qr-section { background:var(--color-surface); border-radius:var(--radius-lg); padding:2rem; text-align:center; margin-top:0.5rem; border:1px solid var(--color-border-light); }
    .qr-wrapper { position:relative; display:inline-block; margin:1rem 0; }
    .qr-wrapper canvas, .qr-wrapper img { border-radius:var(--radius-md); }
    .qr-timer { font-size:0.85rem; color:var(--color-text-muted); margin-top:0.5rem; }
    .qr-scan-line-overlay { position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden; pointer-events:none; border-radius:var(--radius-md); }
    .qr-scan-line-overlay::after { content:''; position:absolute; left:5%; width:90%; height:2px; background:linear-gradient(90deg, transparent, var(--color-primary), transparent); animation:scanLine 2s ease-in-out infinite; }
    .streak-section { background:linear-gradient(135deg, #0D3D25, #1A5E3A); border-radius:var(--radius-xl); padding:2.5rem; color:white; margin-top:2rem; text-align:center; }
    .streak-section h3 { color:white; margin-bottom:1.5rem; }
    .streak-stats { display:flex; justify-content:center; gap:2rem; flex-wrap:wrap; margin-bottom:1.5rem; }
    .streak-stat-value { font-size:2rem; font-weight:800; color:var(--color-accent); }
    .streak-stat-label { font-size:0.85rem; color:rgba(255,255,255,0.7); }
    .badges-row { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
    .badge-medal { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:var(--radius-md); padding:0.75rem 1rem; font-size:0.85rem; font-weight:600; animation:badgePop 0.5s ease backwards; }
    @media (max-width:480px) { .order-card { flex-direction:column; text-align:center; } .order-img { align-self:center; } }
  </style>
</head>
<body>
  <div class="orders-page">
    <div id="navbar"></div>
    <div class="orders-content">
      <h1>My Orders</h1>
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('active')">Active Orders</button>
        <button class="tab-btn" onclick="showTab('past')">Past Orders</button>
      </div>
      <div id="ordersList"></div>
      <div id="streakSection"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/websocket.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/my-orders.js"></script>
</body>
</html>
